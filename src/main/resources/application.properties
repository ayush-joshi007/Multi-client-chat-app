server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chatdb?useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update


jwt.secret=${JWT_SECRET:devOnlyJwtSecretForLocalDevelopmentChangeInProduction123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}
