<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="register-box" >
    <p id="responseMessage"></p>
    <div id="left"></div>
    <div id="registrationWindow">
      <br>
      <br>
      <h1>REGISTRATION</h1>
      <br>
      <br>

      <label for="userName">Username: </label>
      <input type="text" id="userName" placeholder="Username">
      <br>
      <br>
      <br>

      <label for="email">Email: </label>
      <input type="email" id="email" placeholder="Email">
      <br>
      <br>
      <br>

      <label for="password">Password: </label>
      <input type="password" id="password" placeholder="Password">
      <br>
      <br>
      <br>
      <br>

      <button id="registerBtn">Register</button><br> <br> <br>
      <span>Already have an account? </span>
      <button id ="loginBtn">Login</button>
    </div>

    <div id="right"></div>
  </div>

<script>
  const registerBtn = document.getElementById("registerBtn");
  registerBtn.addEventListener("click", function () {
    const userName = document.getElementById("userName");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const registerRequest = {
      userName: userName.value,
      email: email.value,
      password: password.value
    };
    const registerRequestJson = JSON.stringify(registerRequest);

    fetch("/auth/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: registerRequestJson
    }).then(response => response.text()
    ).then(data => {
      const responseMessage = document.getElementById("responseMessage");
      responseMessage.textContent = data;

    });

  });

  const loginBtn = document.getElementById("loginBtn");
  loginBtn.addEventListener("click", function (){
    window.location.href = "login.html";
  });

  const registrationWindow = document.getElementById("registrationWindow");
  registrationWindow.addEventListener("keydown", function (event){
    if(event.key === "Enter"){
      registerBtn.click();
    }
  })
</script>

</body>
</html>
