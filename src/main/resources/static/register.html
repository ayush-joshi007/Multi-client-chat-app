<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Relay | Register</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <img src="relay-main.png"
       alt="Relay"
       class="app-logo">
</header>

<div class="register-page">

  <div id="register-box">

    <p id="responseMessage"></p>

    <div id="registrationWindow">

      <h1>Create your account</h1>

      <p class="auth-subtitle">
        Join Relay and start chatting instantly.
      </p>

      <div class="auth-field">
        <label for="userName">Username</label>
        <input type="text" id="userName" placeholder="Username">
      </div>

      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email">
      </div>

      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password">
      </div>

      <button id="registerBtn">Register</button>

      <div class="auth-switch">
        <span>Already have an account?</span>
        <button id="loginBtn">Login</button>
      </div>

    </div>

  </div>

</div>

<script>
  const registerBtn = document.getElementById("registerBtn");
  registerBtn.addEventListener("click", function () {
    const userName = document.getElementById("userName");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const registerRequest = {
      userName: userName.value,
      email: email.value,
      password: password.value
    };
    const registerRequestJson = JSON.stringify(registerRequest);

    fetch("/auth/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: registerRequestJson
    }).then(response => response.text().then(data => ({
      ok: response.ok,
      message: data
    }))
    ).then(result => {
      const responseMessage = document.getElementById("responseMessage");
      responseMessage.className = result.ok ? "success" : "error";
      responseMessage.textContent = result.message;

    });

  });

  const loginBtn = document.getElementById("loginBtn");
  loginBtn.addEventListener("click", function (){
    window.location.href = "login.html";
  });

  const registrationWindow = document.getElementById("registrationWindow");
  registrationWindow.addEventListener("keydown", function (event){
    if(event.key === "Enter"){
      registerBtn.click();
    }
  })
</script>

</body>
</html>
