<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Relay | Login</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
    <img src="relay-main.png"
         alt="Relay"
         class="app-logo">
</header>

<div class="login-page">

    <div id="login-box">

        <p id="responseMessage"></p>

        <div id="loginWindow">

            <h1>Welcome back</h1>

            <p class="auth-subtitle">
                Sign in to continue your conversations.
            </p>

            <div class="auth-field">
                <label for="userName">Username</label>
                <input type="text" id="userName" placeholder="Username">
            </div>

            <div class="auth-field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password">
            </div>

            <button id="loginBtn">Login</button>

            <div class="auth-switch">
                <span>Don't have an account?</span>
                <button id="registerBtn">Register</button>
            </div>

        </div>

    </div>

</div>

    <script>
        const loginBtn = document.getElementById("loginBtn");
        loginBtn.addEventListener("click", function (){
            const userName = document.getElementById("userName");
            const password = document.getElementById("password");

            const loginRequest = {
                userName: userName.value,
                password: password.value
            };
            const loginRequestJson = JSON.stringify(loginRequest);
            fetch('/auth/login', {
                method: 'POST',
                headers: {
                    "Content-Type": "application/json"
                },
                body: loginRequestJson
            }).then(response => {
                if (!response.ok) {
                    throw new Error("Incorrect Credentials!");
                }
                return response.json();
            }).then(data => {
                const response = document.getElementById("responseMessage");
                response.className = "success";
                response.textContent = "Login Successful!";
               localStorage.setItem("userId", data.userId);
               localStorage.setItem("userName", data.userName);
               localStorage.setItem("token", data.token);
               window.location.href = "index.html";
            }).catch(error => {
                const response = document.getElementById("responseMessage");
                response.className = "error";
                response.textContent = error.message;
            });
        });


        const registerBtn = document.getElementById("registerBtn");
        registerBtn.addEventListener("click", function (){
            window.location.href = "register.html";
        })

        const loginWindow = document.getElementById("loginWindow");
        loginWindow.addEventListener("keydown", function (event){
            if(event.key === "Enter"){
                loginBtn.click();
            }
        });
    </script>

</body>
</html>
